<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScheduleGo - Jadwal Pelajaran Sekolah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS for Smooth Animations -->
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
        }
        .subject-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .subject-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-30 glass border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/30">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent">ScheduleGo</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Jadwal Pelajaran Sekolah Interaktif</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center space-x-3">
                <!-- Search Box -->
                <div class="relative hidden md:block w-64">
                    <input type="text" id="searchInput" placeholder="Cari mata pelajaran..." 
                           class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                </div>

                <!-- Dark Mode Toggle -->
                <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all">
                    <i data-lucide="moon" id="themeIconMoon" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="sun" id="themeIconSun" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search Input Mobile -->
        <div class="mb-6 md:hidden">
            <div class="relative w-full">
                <input type="text" id="searchInputMobile" placeholder="Cari mata pelajaran..." 
                       class="w-full pl-9 pr-4 py-2.5 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-sm">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
            </div>
        </div>

        <!-- Day Selector Tabs -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-8 no-scrollbar scroll-smooth" id="dayTabs">
            <!-- Dynamic Day Buttons generated by JS -->
        </div>

        <!-- Live Clock & Status Bar -->
        <div class="mb-8 p-4 rounded-2xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-xl shadow-sky-500/10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-3 bg-white/10 backdrop-blur-md rounded-xl">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div>
                    <div id="liveClock" class="font-mono text-xl font-bold tracking-wider">00:00:00 WIB</div>
                    <div id="currentDayText" class="text-xs text-sky-100 font-medium">Memuat hari...</div>
                </div>
            </div>
            <div id="statusBadge" class="self-start sm:self-center px-3 py-1.5 rounded-full bg-white/20 backdrop-blur-md text-xs font-semibold tracking-wide flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="statusText">Memuat status kelas...</span>
            </div>
        </div>

        <!-- Schedule List / Grid -->
        <div class="space-y-4" id="scheduleContainer">
            <!-- Schedule Items Will Be Rendered Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                <i data-lucide="calendar-x" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-300">Mata Pelajaran Tidak Ditemukan</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Coba kata kunci pencarian lain atau pilih hari yang berbeda.</p>
        </div>
    </main>

    <!-- Subject Detail Modal -->
    <div id="subjectModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-lg w-full mx-4 p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-95 transition-transform duration-300 relative">
            <button id="closeModal" class="absolute top-5 right-5 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="flex items-center space-x-3 mb-4">
                <div id="modalIconBg" class="w-12 h-12 rounded-2xl flex items-center justify-center text-white">
                    <i id="modalIcon" data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="text-xl font-bold text-slate-800 dark:text-slate-100">Nama Mapel</h3>
                    <p id="modalTime" class="text-xs font-semibold text-sky-600 dark:text-sky-400">07:00 - 08:00 WIB</p>
                </div>
            </div>

            <div class="space-y-4 text-sm text-slate-600 dark:text-slate-300">
                <div>
                    <label class="block font-medium text-xs text-slate-400 mb-1">Rincian Hari</label>
                    <p id="modalDay" class="font-semibold text-slate-700 dark:text-slate-200">Senin</p>
                </div>

                <div>
                    <label for="modalNote" class="block font-medium text-xs text-slate-400 mb-1">Catatan Pribadi / Tugas</label>
                    <textarea id="modalNote" rows="4" placeholder="Tulis catatan tugas, PR, atau perlengkapan yang perlu dibawa..." 
                              class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-800 dark:text-slate-200 text-sm"></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-3">
                <button id="saveNoteBtn" class="w-full sm:w-auto px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-xl text-sm transition-all shadow-lg shadow-sky-600/20">
                    Simpan Catatan
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        // Schedule Data Structure
        const scheduleData = {
            senin: [
                { id: 'sen-1', name: 'Informatika', time: '07:00 - 08:30', start: '07:00', end: '08:30', icon: 'laptop', color: 'from-blue-500 to-indigo-600', isBreak: false },
                { id: 'sen-2', name: 'Coding', time: '08:30 - 10:00', start: '08:30', end: '10:00', icon: 'code', color: 'from-purple-500 to-pink-600', isBreak: false },
                { id: 'sen-3', name: 'Istirahat Pertama', time: '10:00 - 10:30', start: '10:00', end: '10:30', icon: 'coffee', color: 'from-amber-400 to-orange-500', isBreak: true },
                { id: 'sen-4', name: 'Matematika Lanjutan', time: '10:30 - 12:00', start: '10:30', end: '12:00', icon: 'binary', color: 'from-emerald-500 to-teal-600', isBreak: false },
                { id: 'sen-5', name: 'Istirahat Kedua', time: '12:00 - 12:45', start: '12:00', end: '12:45', icon: 'utensils', color: 'from-amber-400 to-orange-500', isBreak: true },
                { id: 'sen-6', name: 'Matematika Wajib', time: '12:45 - 14:15', start: '12:45', end: '14:15', icon: 'calculator', color: 'from-cyan-500 to-blue-600', isBreak: false }
            ],
            selasa: [
                { id: 'sel-1', name: 'Fisika', time: '07:00 - 08:30', start: '07:00', end: '08:30', icon: 'atom', color: 'from-sky-500 to-blue-600', isBreak: false },
                { id: 'sel-2', name: 'Bahasa Inggris', time: '08:30 - 10:00', start: '08:30', end: '10:00', icon: 'languages', color: 'from-violet-500 to-purple-600', isBreak: false },
                { id: 'sel-3', name: 'Istirahat', time: '10:00 - 10:30', start: '10:00', end: '10:30', icon: 'coffee', color: 'from-amber-400 to-orange-500', isBreak: true },
                { id: 'sel-4', name: 'Bahasa Inggris Lanjutan', time: '10:30 - 12:00', start: '10:30', end: '12:00', icon: 'globe-2', color: 'from-indigo-500 to-violet-600', isBreak: false },
                { id: 'sel-5', name: 'PJOK', time: '12:30 - 14:00', start: '12:30', end: '14:00', icon: 'activity', color: 'from-lime-500 to-emerald-600', isBreak: false }
            ],
            rabu: [
                { id: 'rab-1', name: 'Informatika Lanjutan', time: '07:00 - 09:00', start: '07:00', end: '09:00', icon: 'cpu', color: 'from-blue-600 to-cyan-600', isBreak: false },
                { id: 'rab-2', name: 'Coding', time: '09:00 - 10:15', start: '09:00', end: '10:15', icon: 'terminal', color: 'from-fuchsia-500 to-pink-600', isBreak: false },
                { id: 'rab-3', name: 'Istirahat', time: '10:15 - 10:45', start: '10:15', end: '10:45', icon: 'coffee', color: 'from-amber-400 to-orange-500', isBreak: true },
                { id: 'rab-4', name: 'PKN', time: '10:45 - 12:15', start: '10:45', end: '12:15', icon: 'shield-check', color: 'from-red-500 to-rose-600', isBreak: false },
                { id: 'rab-5', name: 'Sejarah', time: '12:45 - 14:15', start: '12:45', end: '14:15', icon: 'landmark', color: 'from-yellow-600 to-amber-700', isBreak: false }
            ],
            kamis: [
                { id: 'kam-1', name: 'Matematika Lanjutan', time: '07:00 - 08:30', start: '07:00', end: '08:30', icon: 'binary', color: 'from-emerald-500 to-teal-600', isBreak: false },
                { id: 'kam-2', name: 'Fisika', time: '08:30 - 10:00', start: '08:30', end: '10:00', icon: 'atom', color: 'from-sky-500 to-blue-600', isBreak: false },
                { id: 'kam-3', name: 'Istirahat', time: '10:00 - 10:30', start: '10:00', end: '10:30', icon: 'coffee', color: 'from-amber-400 to-orange-500', isBreak: true },
                { id: 'kam-4', name: 'Informatika Lanjutan', time: '10:30 - 12:00', start: '10:30', end: '12:00', icon: 'cpu', color: 'from-blue-600 to-cyan-600', isBreak: false },
                { id: 'kam-5', name: 'Bahasa Inggris Lanjutan', time: '12:30 - 14:00', start: '12:30', end: '14:00', icon: 'globe-2', color: 'from-indigo-500 to-violet-600', isBreak: false }
            ],
            jumat: [
                { id: 'jum-1', name: 'PJOK', time: '07:00 - 08:30', start: '07:00', end: '08:30', icon: 'activity', color: 'from-lime-500 to-emerald-600', isBreak: false },
                { id: 'jum-2', name: 'Matematika Wajib', time: '08:30 - 09:45', start: '08:30', end: '09:45', icon: 'calculator', color: 'from-cyan-500 to-blue-600', isBreak: false },
                { id: 'jum-3', name: 'Istirahat', time: '09:45 - 10:15', start: '09:45', end: '10:15', icon: 'coffee', color: 'from-amber-400 to-orange-500', isBreak: true },
                { id: 'jum-4', name: 'PKN', time: '10:15 - 11:30', start: '10:15', end: '11:30', icon: 'shield-check', color: 'from-red-500 to-rose-600', isBreak: false }
            ]
        };

        const days = [
            { key: 'senin', label: 'Senin' },
            { key: 'selasa', label: 'Selasa' },
            { key: 'rabu', label: 'Rabu' },
            { key: 'kamis', label: 'Kamis' },
            { key: 'jumat', label: 'Jumat' }
        ];

        // State Management
        let selectedDay = 'senin';
        let searchQuery = '';
        let activeSubjectForNote = null;

        // DOM Elements
        const dayTabsContainer = document.getElementById('dayTabs');
        const scheduleContainer = document.getElementById('scheduleContainer');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const searchInputMobile = document.getElementById('searchInputMobile');
        const liveClock = document.getElementById('liveClock');
        const currentDayText = document.getElementById('currentDayText');
        const statusText = document.getElementById('statusText');

        // Modal Elements
        const subjectModal = document.getElementById('subjectModal');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalTime = document.getElementById('modalTime');
        const modalDay = document.getElementById('modalDay');
        const modalIconBg = document.getElementById('modalIconBg');
        const modalIcon = document.getElementById('modalIcon');
        const modalNote = document.getElementById('modalNote');
        const saveNoteBtn = document.getElementById('saveNoteBtn');

        // Theme Logic
        const themeToggle = document.getElementById('themeToggle');
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        // Initialize Day Selector Tabs
        function initTabs() {
            dayTabsContainer.innerHTML = days.map(day => `
                <button onclick="setDay('${day.key}')" 
                        class="px-5 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap transition-all duration-200 flex items-center space-x-2 ${selectedDay === day.key ? 'bg-sky-600 text-white shadow-lg shadow-sky-600/30' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'}">
                    <span>${day.label}</span>
                    <span class="text-xs px-2 py-0.5 rounded-full ${selectedDay === day.key ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'}">
                        ${scheduleData[day.key].filter(s => !s.isBreak).length} Mapel
                    </span>
                </button>
            `).join('');
        }

        function setDay(dayKey) {
            selectedDay = dayKey;
            initTabs();
            renderSchedule();
        }

        // Render Schedule Items
        function renderSchedule() {
            const list = scheduleData[selectedDay] || [];
            const filtered = list.filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()));

            if (filtered.length === 0) {
                scheduleContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            scheduleContainer.innerHTML = filtered.map(item => {
                const noteKey = `note_${item.id}`;
                const hasNote = !!localStorage.getItem(noteKey);

                if (item.isBreak) {
                    return `
                        <div class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-between text-amber-700 dark:text-amber-400">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center">
                                    <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-base">${item.name}</h4>
                                    <p class="text-xs opacity-80">${item.time} WIB</p>
                                </div>
                            </div>
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-amber-500/20">Waktu Rehat</span>
                        </div>
                    `;
                }

                return `
                    <div onclick="openSubjectModal('${item.id}')" 
                         class="subject-card p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-4 relative overflow-hidden group">
                        
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr ${item.color} text-white flex items-center justify-center shadow-md flex-shrink-0">
                                <i data-lucide="${item.icon}" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h4 class="font-bold text-slate-800 dark:text-slate-100 text-lg group-hover:text-sky-600 dark:group-hover:text-sky-400 transition-colors">${item.name}</h4>
                                    ${hasNote ? '<span class="w-2 h-2 rounded-full bg-sky-500" title="Ada catatan"></span>' : ''}
                                </div>
                                <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                    <span>${item.time} WIB</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between sm:justify-end space-x-3 border-t sm:border-t-0 border-slate-100 dark:border-slate-700/50 pt-3 sm:pt-0">
                            ${hasNote ? `
                                <span class="text-xs bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-400 px-3 py-1 rounded-lg border border-sky-200 dark:border-sky-800 flex items-center space-x-1">
                                    <i data-lucide="file-text" class="w-3 h-3"></i>
                                    <span>Ada Catatan</span>
                                </span>
                            ` : ''}
                            <div class="text-slate-400 group-hover:text-sky-500 transition-colors">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Live Clock & Active Class Detector
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
            liveClock.innerText = `${timeString} WIB`;

            const daysMap = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
            const currentDayKey = daysMap[now.getDay()];
            const dayLabel = days.find(d => d.key === currentDayKey)?.label || 'Akhir Pekan';

            currentDayText.innerText = `Hari Ini: ${dayLabel}, ${now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;

            // Check Active Class
            if (scheduleData[currentDayKey]) {
                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const activeItem = scheduleData[currentDayKey].find(item => {
                    const [hStart, mStart] = item.start.split(':').map(Number);
                    const [hEnd, mEnd] = item.end.split(':').map(Number);
                    const startMin = hStart * 60 + mStart;
                    const endMin = hEnd * 60 + mEnd;
                    return currentMinutes >= startMin && currentMinutes < endMin;
                });

                if (activeItem) {
                    statusText.innerText = `Berlangsung: ${activeItem.name} (${activeItem.time})`;
                } else {
                    statusText.innerText = 'Tidak ada kelas berlangsung saat ini';
                }
            } else {
                statusText.innerText = 'Libur Akhir Pekan';
            }
        }

        // Modal Functions
        function openSubjectModal(id) {
            let item = null;
            for (const key in scheduleData) {
                const found = scheduleData[key].find(s => s.id === id);
                if (found) { item = found; break; }
            }

            if (!item) return;

            activeSubjectForNote = item;
            modalTitle.innerText = item.name;
            modalTime.innerText = `${item.time} WIB`;
            modalDay.innerText = days.find(d => d.key === selectedDay)?.label || 'Senin';

            modalIconBg.className = `w-12 h-12 rounded-2xl bg-gradient-to-tr ${item.color} flex items-center justify-center text-white`;
            modalIcon.setAttribute('data-lucide', item.icon);

            const savedNote = localStorage.getItem(`note_${item.id}`) || '';
            modalNote.value = savedNote;

            subjectModal.classList.remove('hidden');
            setTimeout(() => {
                subjectModal.classList.remove('opacity-0');
                subjectModal.firstElementChild.classList.remove('scale-95');
            }, 10);

            lucide.createIcons();
        }

        function closeModalFunc() {
            subjectModal.firstElementChild.classList.add('scale-95');
            subjectModal.classList.add('opacity-0');
            setTimeout(() => {
                subjectModal.classList.add('hidden');
            }, 300);
        }

        saveNoteBtn.addEventListener('click', () => {
            if (activeSubjectForNote) {
                const noteVal = modalNote.value.trim();
                if (noteVal) {
                    localStorage.setItem(`note_${activeSubjectForNote.id}`, noteVal);
                } else {
                    localStorage.removeItem(`note_${activeSubjectForNote.id}`);
                }
                renderSchedule();
                closeModalFunc();
            }
        });

        closeModal.addEventListener('click', closeModalFunc);
        subjectModal.addEventListener('click', (e) => {
            if (e.target === subjectModal) closeModalFunc();
        });

        // Search Handlers
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderSchedule();
        });

        searchInputMobile.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderSchedule();
        });

        // Auto select current day if weekday
        const todayIdx = new Date().getDay();
        const daysArray = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
        if (todayIdx >= 1 && todayIdx <= 5) {
            selectedDay = daysArray[todayIdx];
        }

        // Initialize App
        initTabs();
        renderSchedule();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
